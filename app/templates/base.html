<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('app.title') }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="/">{{ t('app.title') }}</a></strong></li>
      </ul>
      <ul>
        {% if current_user %}
          <li class="muted">{{ current_user.display_name }}</li>
          <li><a href="/password">{{ t('nav.password') }}</a></li>
          <li>
            <form method="post" action="/logout" class="inline">
              <button type="submit" class="outline secondary">{{ t('nav.logout') }}</button>
            </form>
          </li>
        {% else %}
          <li><a href="/login">{{ t('nav.login') }}</a></li>
        {% endif %}
      </ul>
    </nav>
  </header>
  <main class="container">
    {% for f in flashes %}
      <article class="flash flash-{{ f.category }}" role="status">{{ f.text }}</article>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
