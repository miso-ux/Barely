{% extends "base.html" %}

{% block content %}
<hgroup>
  <h1>{{ t('home.heading') }}</h1>
  <p>{{ t('app.tagline') }}</p>
</hgroup>
<p>{{ t('home.skeleton_notice') }}</p>
<p>
  {% if db_ok %}
    <mark>{{ t('home.db_ok') }}</mark>
  {% else %}
    <mark class="error">{{ t('home.db_error') }}</mark>
  {% endif %}
</p>
{% endblock %}
