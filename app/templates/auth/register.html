{% extends "base.html" %}
{% block title %}{{ t('auth.register_title') }} · {{ t('app.title') }}{% endblock %}

{% block content %}
<article class="narrow">
  <h1>{{ t('auth.register_title') }}</h1>
  {% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>{{ t('auth.username') }}
      <input type="text" name="username" value="{{ username or '' }}" autocomplete="username" required>
      <small>{{ t('auth.username_help') }}</small>
    </label>
    <label>{{ t('users.display_name') }}
      <input type="text" name="display_name" value="{{ display_name or '' }}" required>
    </label>
    <label>{{ t('auth.password') }}
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <label>{{ t('auth.new_password_confirm') }}
      <input type="password" name="password_confirm" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit">{{ t('auth.register_button') }}</button>
  </form>
  <p><a href="/login">{{ t('auth.back_to_login') }}</a></p>
</article>
{% endblock %}
