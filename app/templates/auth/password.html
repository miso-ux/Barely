{% extends "base.html" %}
{% block title %}{{ t('auth.password_title') }} · {{ t('app.title') }}{% endblock %}

{% block content %}
<article class="narrow">
  <h1>{{ t('auth.password_title') }}</h1>
  {% if forced %}<p>{{ t('auth.password_change_required') }}</p>{% endif %}
  {% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/password">
    <label>{{ t('auth.current_password') }}
      <input type="password" name="current_password" autocomplete="current-password" required>
    </label>
    <label>{{ t('auth.new_password') }}
      <input type="password" name="new_password" autocomplete="new-password" required minlength="8">
    </label>
    <label>{{ t('auth.new_password_confirm') }}
      <input type="password" name="new_password_confirm" autocomplete="new-password" required minlength="8">
    </label>
    <button type="submit">{{ t('auth.password_button') }}</button>
  </form>
</article>
{% endblock %}
